# CTF-Dojo — OctoTools expert baseline (Lu et al., ACL 2026 oral).
# Static hand-designed Planner+Executor+Tool-Cards harness. No self-evolution.
batch_size: 5
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: false
evolve_skills: false
evolve_memory: false
evolve_tools: false

model_name: <solver-model-id>

evolver_model: <evolver-model-id>
evolver_max_tokens: 128000

solve_workers: 8

egl_threshold: 0.05
egl_window: 3

sandbox_network: host
evolver_sandbox_network: none

orchestrator: octotools_expert
octotools_expert:
  variant: reasoning        # no web search for ctf_dojo
