# Continual Harness-lite baseline (Karten et al., 2025).
# Four-pass CRUD evolution: prompt, skills, memory, tools.
batch_size: 100
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true

model_name: <solver-model-id>
evolver_model: <evolver-model-id>
evolver_max_tokens: 128000

solve_workers: 8

egl_threshold: 0.05
egl_window: 3

sandbox_network: host
evolver_sandbox_network: none

orchestrator: continual_harness_lite
