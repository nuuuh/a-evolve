# Debug: MiroFlow strategy — Serper+Jina+Wayback tools, no evolution
# Tests whether MiroFlow's search pipeline solves L3+L4 tasks
# Runs on the exact 31 L3+L4 tasks from the April 2 live submission
batch_size: 140
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: false
evolve_skills: false
evolve_memory: false
# true so the solver LOADS tools from the seed workspace (no evolution runs since max_cycles=0)
evolve_tools: true

evolver_model: <evolver-model-id>
evolver_max_tokens: 128000

egl_threshold: 0.05
egl_window: 3

evo_trigger_threshold: -1

model_name: <solver-model-id>
sort_by_timestamp: true

# OFF — solver uses evolved tools (serper, jina, wayback) instead of builtin search
builtin_search: "off"

# BRIDGE — tools need network to call Serper/Jina/Wayback APIs
sandbox_network: bridge
evolver_sandbox_network: bridge

futurex_difficulty: [3, 4]

