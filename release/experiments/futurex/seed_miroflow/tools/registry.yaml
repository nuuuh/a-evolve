tools:
  - name: serper_search
    description: "Google Search via Serper API. Supports Chinese locale (gl=cn, hl=zh) for finding Chinese platform data, financial sites, government reports. Returns ranked results with titles, snippets, and URLs."
    usage: "python3 tools/serper_search.py '搜索关键词' --gl cn --hl zh --num 10"

  - name: jina_reader
    description: "Read any URL with JavaScript browser rendering via Jina Reader API. Works on Douban, Maoyan, QQ Music, Maoer FM, Dongchedi, Eastmoney, and other JS-heavy Chinese platforms WITHOUT login. Returns page content as markdown."
    usage: "python3 tools/jina_reader.py 'https://example.com' --max-chars 8000"

  - name: wayback_search
    description: "Search the Wayback Machine for historical snapshots of a URL. Use when a platform shows current data but you need data from a specific past date."
    usage: "python3 tools/wayback_search.py 'https://example.com/page' '2026-04-10'"

  - name: wiki_revision
    description: "Search Wikipedia revision history for a page in a specific month. Returns revision IDs and URLs you can read with jina_reader to see the page as it was on that date."
    usage: "python3 tools/wiki_revision.py 'Page_Title' '2026-04' --lang en"
