<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Studio — Evolution System Designer</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div class="brand">Navigation Studio</div>
    <div class="toolbar">
      <select id="top-level-picker" title="Top-level Activity (entry point)"></select>
      <button id="btn-validate">Validate</button>
      <button id="btn-preview">Preview (Mermaid)</button>
      <button id="btn-save">Save JSON</button>
      <button id="btn-load">Load JSON</button>
      <button id="btn-load-shipped">Load Shipped…</button>
      <button id="btn-export" class="primary">Export .py</button>
      <input type="file" id="file-picker" accept=".json" hidden>
    </div>
  </header>

  <main>
    <aside id="activities-panel" class="panel left">
      <div class="panel-header">
        <span>Activities</span>
        <button id="btn-new-activity" title="New Activity">＋</button>
      </div>
      <ul id="activities-list"></ul>

      <div class="panel-header">
        <span>Parameters</span>
        <button id="btn-new-param" title="Add parameter">＋</button>
      </div>
      <ul id="parameters-list"></ul>
    </aside>

    <section id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#334"/>
          </marker>
          <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
          </marker>
        </defs>
        <g id="flows-layer"></g>
        <g id="nodes-layer"></g>
        <path id="pending-wire" class="pending-wire" style="display:none" />
      </svg>
      <div id="status-bar"></div>
    </section>

    <aside id="right-panel" class="panel right">
      <div class="panel-header"><span>Palette</span></div>
      <div id="palette"></div>

      <div class="panel-header"><span>Inspector</span></div>
      <div id="inspector">
        <p class="hint">Click a node or parameter to edit it.</p>
      </div>
    </aside>
  </main>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h3 id="modal-title">Title</h3>
      <div id="modal-body"></div>
      <menu class="modal-buttons">
        <button value="cancel">Cancel</button>
        <button id="modal-ok" value="ok" class="primary">OK</button>
      </menu>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
