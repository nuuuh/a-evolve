# Experiment: Human-in-the-Loop Infrastructure Evolution via Telegram
# Same as futurex_infra_opus but the evolver can request API keys from a human
# mid-conversation via Telegram.
#
# Setup:
#   1. Create a Telegram bot via @BotFather
#   2. Get your chat ID (run: python experiments/futurex_hitl/test_telegram.py)
#   3. Fill in telegram_bot_token and telegram_chat_id below
#   4. Run: bash experiments/futurex_hitl/run.sh

batch_size: 1
max_cycles: 20
holdout_ratio: 0.0

# Prompt + tools only — force evolver to focus on building tools
evolve_prompts: true
evolve_skills: false
evolve_memory: false
evolve_tools: true

# Strong Opus evolver with high token budget
evolver_model: us.anthropic.claude-opus-4-6-v1
evolver_max_tokens: 128000
evolver_temperature: 0.2
trajectory_only: true

egl_threshold: 0.05
egl_window: 3

# NO built-in web search — evolver must build everything
no_web_search: true

# Standard FutureX settings
model_name: us.anthropic.claude-sonnet-4-6
sort_by_timestamp: true
sandbox_network: host
evolver_sandbox_network: host

# ── Human-in-the-Loop (Slack) ────────────────────────────
human_in_the_loop: true
human_interface: slack
slack_bot_token: "${SLACK_BOT_TOKEN}"
slack_channel_id: "${SLACK_CHANNEL_ID}"

