# FutureX — OctoTools expert baseline (Lu et al., ACL 2026 oral).
# Static hand-designed Planner+Executor+Tool-Cards harness. No self-evolution.
# Search-enabled variant: FutureX tasks require retrieval over the open web.
batch_size: 20
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: false
evolve_skills: false
evolve_memory: false
evolve_tools: false

model_name: us.anthropic.claude-sonnet-4-6

evolver_model: us.anthropic.claude-opus-4-6-v1
evolver_max_tokens: 128000

egl_threshold: 0.05
egl_window: 3

sort_by_timestamp: true
builtin_search: "off"        # solver uses workspace search pipeline, not built-in
sandbox_network: bridge
evolver_sandbox_network: bridge

orchestrator: octotools_expert
octotools_expert:
  variant: search            # web-search tool-card included
