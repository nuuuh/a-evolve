# FutureX baseline — no evolution, live DuckDuckGo search (unrestricted)
batch_size: 20
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: false
evolve_skills: false
evolve_memory: false
evolve_tools: false

evolver_model: us.anthropic.claude-opus-4-6-v1
evolver_max_tokens: 128000

egl_threshold: 0.05
egl_window: 3

# negative = never evolve (baseline control run)
evo_trigger_threshold: -1

# FutureX-specific
model_name: us.anthropic.claude-sonnet-4-6
sort_by_timestamp: true
builtin_search: live
