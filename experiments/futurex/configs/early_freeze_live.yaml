# FutureX early freeze — evolve first 40%, freeze rest, live search
batch_size: 20
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: true
evolve_skills: true
evolve_memory: true
evolve_tools: true

evolver_model: us.anthropic.claude-opus-4-6-v1
evolver_max_tokens: 128000

egl_threshold: 0.05
egl_window: 3

evo_freeze_after_pct: 40

# FutureX-specific
model_name: us.anthropic.claude-sonnet-4-6
sort_by_timestamp: true
search_mode: live
