# PolyBench — OctoTools expert baseline (Lu et al., ACL 2026 oral).
# Static hand-designed Planner+Executor+Tool-Cards harness installed once at
# cycle 0 and frozen thereafter. No self-evolution.
batch_size: 100
max_cycles: 0
holdout_ratio: 0.0

evolve_prompts: false
evolve_skills: false
evolve_memory: false
evolve_tools: false

# Solver backbone: Sonnet 4.6 (same as all other RQ1 baselines).
model_name: us.anthropic.claude-sonnet-4-6

# Evolver only installs prompts at cycle 0 — no LLM activity afterward.
evolver_model: us.anthropic.claude-opus-4-6-v1
evolver_max_tokens: 128000

solve_workers: 24

egl_threshold: 0.05
egl_window: 3

orchestrator: octotools_expert
octotools_expert:
  variant: reasoning        # no web search for polybench
